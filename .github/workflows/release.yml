name: release
# Runs after a merge to main: derives the version from CHANGELOG.md, rebuilds dist/ and pushes one release commit.
# The merge commit's runtime identity (the owner GitHub no-reply address) is reused for the release commit; the step
# refuses any other identity. A release commit pushed with GITHUB_TOKEN does not start another run.
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: release
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Release, verify, publish
        run: |
          # Another merge can reach main while the release is being verified. The push is never forced: on a
          # rejection the job restarts from the new tip and derives the release again (its own run covers the rest).
          for attempt in 1 2 3; do
            result=$(node scripts/release.mjs --apply)
            echo "$result"
            case "$result" in *'"released":true'*) ;; *) exit 0 ;; esac
            npm test
            npm run gate
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git reset --hard origin/main
          done
          echo "main moved on every attempt; the next push run will release"
          exit 1
